<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3efe7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161412" media="(prefers-color-scheme: dark)" />
    <title>pdf-to-audiobook</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="app"></div>
    <p id="live-status" class="toast" role="status" aria-live="assertive" aria-atomic="true"></p>
    <audio id="audio" preload="metadata"></audio>
    <input id="pdf-file" type="file" accept="application/pdf,.pdf" hidden aria-label="PDF file" />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
